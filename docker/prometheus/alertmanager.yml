route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # No real notification channel wired up - webhook/email/Slack all need credentials this repo
  # doesn't have. Alerts still show up at http://localhost:9093 either way. To actually get
  # paged, add e.g. a slack_configs or webhook_configs block here:
  #   - name: default
  #     slack_configs:
  #       - api_url: "https://hooks.slack.com/services/..."
  #         channel: "#platform-alerts"
  - name: default
