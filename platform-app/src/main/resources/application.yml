spring:
  application:
    name: platform-app

  config:
    import: "optional:vault://"   # secrets (DB password, Keycloak client-secret) pulled from Vault at boot

  cloud:
    vault:
      uri: http://localhost:8200
      authentication: TOKEN
      token: ${VAULT_TOKEN:root}   # dev-only root token; use AppRole/Kubernetes auth in real envs
      kv:
        enabled: true
        backend: secret
        default-context: platform-app

  datasource:
    # Each module-* owns its own schema (module-user -> platform_user, module-post -> platform_post,
    # etc.) even though today they all still run through this one connection/JVM - the point is that
    # a table never crosses that boundary, so a module can be pointed at its own DataSource (or its
    # own database server entirely) later without a data migration.
    url: jdbc:mysql://localhost:3306/platform_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USERNAME:platform_app}
    password: ${DB_PASSWORD:changeme}   # overridden by Vault in real environments

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never auto-generated
    properties:
      hibernate:
        integration:
          envers:
            enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer - the ONLY line that changes if you ever swap OIDC providers
          issuer-uri: http://localhost:8080/realms/platform
      client:
        registration:
          keycloak:
            client-id: platform-app
            client-secret: ${KEYCLOAK_CLIENT_SECRET:changeme-in-vault}   # overridden by Vault in real environments
            authorization-grant-type: authorization_code
            scope: openid, profile, email
          keycloak-admin:
            provider: keycloak
            client-id: platform-app-admin
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:changeme-in-vault-admin}   # overridden by Vault in real environments
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/platform

  threads:
    virtual:
      enabled: true

  # Applies to every RestClient.Builder-based client in the app (KeycloakAdminClient,
  # KeycloakTokenClient) - without this, a hung Keycloak leaves calling threads blocked
  # indefinitely instead of failing fast into the circuit breaker below.
  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# --- platform-cache-starter ---
platform:
  cache:
    default-ttl: 120s
    ttls:
      role-permissions: 300s
      user-profile: 600s
  keycloak:
    admin-base-uri: http://localhost:8080/admin/realms/platform
  web:
    # origins allowed to call this API with an Authorization header (platform-web dev server)
    allowed-origins: http://localhost:5173

# --- resilience4j (guards every KeycloakAdminClient call, see its class-level javadoc) ---
resilience4j:
  circuitbreaker:
    instances:
      keycloakAdmin:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      keycloakAdmin:
        max-attempts: 2
        wait-duration: 500ms
        # Only connection-level failures (timeout, refused, DNS) - never a definite HTTP response,
        # including the 4xx statuses KeycloakAdminClientImpl maps to Business/TechnicalException.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/platform_user?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
  data:
    redis:
      host: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/platform
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/platform
  cloud:
    vault:
      uri: http://vault:8200
platform:
  keycloak:
    admin-base-uri: http://keycloak:8080/admin/realms/platform
